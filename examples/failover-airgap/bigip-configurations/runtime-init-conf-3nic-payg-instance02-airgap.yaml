# Air-gap (route-based VIP failover) variant of
# examples/failover/bigip-configurations/runtime-init-conf-3nic-payg-instance02-with-app.yaml
# Differences: CFE failoverRoutes block; AS3 virtual server on the alien VIP
# (externalVipAddress instance tag); a demo responder iRule; three extra tag-sourced
# runtime_parameters.
# Keep everything else in sync with the source file - see ../MAINTAINING.md.
controls:
  logLevel: info
  logFilename: /var/log/cloud/bigIpRuntimeInit.log
pre_onboard_enabled:
  # Self-heal for the documented BIG-IP/DO device-trust startup-timing bug:
  # /Common/Root is not initialised on first boot, so DO clustering cannot
  # bootstrap ("/Common/Root not found" / "/Common/failoverGroup not found").
  # Installs /config/cluster-heal.sh + a cron job that automates F5's documented
  # workaround (reboot to rebuild Root, then re-apply the DO declaration) and
  # self-disables once the cluster is In Sync. Non-blocking (returns immediately).
  # Source: examples/failover/bigip-configurations/cluster-heal.sh
  # (base64 below; regenerate after edits with: base64 -w0 cluster-heal.sh).
  - name: install_cluster_self_heal
    type: inline
    commands:
      - "echo '' | base64 -d > /config/cluster-heal.sh && chmod 700 /config/cluster-heal.sh && echo '' | base64 -d > /config/cluster-heal-trust.py && chmod 700 /config/cluster-heal-trust.py && echo '*/3 * * * * root /config/cluster-heal.sh >/dev/null 2>&1' > /etc/cron.d/cluster-heal && echo 'cluster-heal self-heal installed'"
extension_packages:
  install_operations:
    - extensionType: do
      extensionVersion: 1.47.0
      extensionUrl: https://f5-cft-gov.s3.us-gov-east-1.amazonaws.com/f5-aws-cloudformation-v2/v3.6.0.0/examples/bigip-extensions/f5-declarative-onboarding-1.47.0-14.noarch.rpm
      extensionHash: 2338ce270d5ee12405e59d4f712b09cd111b24b5f78aee41e90f8e61ee2a36e2
    - extensionType: as3
      extensionVersion: 3.56.0
      extensionUrl: https://f5-cft-gov.s3.us-gov-east-1.amazonaws.com/f5-aws-cloudformation-v2/v3.6.0.0/examples/bigip-extensions/f5-appsvcs-3.56.0-10.noarch.rpm
      extensionHash: 69a9779a724edb9705ec22eb466f39a34d8facbc2f92336ce4ec088296d3530d
    - extensionType: cf
      extensionVersion: 2.4.0
      extensionUrl: https://f5-cft-gov.s3.us-gov-east-1.amazonaws.com/f5-aws-cloudformation-v2/v3.6.0.0/examples/bigip-extensions/f5-cloud-failover-2.4.0-0.noarch.rpm
      extensionHash: 7f69fb8cfab1003c1a5a0348b9e65bb8d344784c0eb8a73d967a2283b9275eee
extension_services:
  service_operations:
    - extensionType: do
      type: inline
      value:
        schemaVersion: 1.0.0
        class: Device
        async: true
        label: Failover 3NIC BIG-IP declaration for Declarative Onboarding with PAYG
          license
        Common:
          class: Tenant
          My_DbVariables:
            class: DbVariables
            config.allow.rfc3927: enable
            tm.tcpudptxchecksum: Software-only
          My_Provisioning:
            asm: nominal
            class: Provision
            ltm: nominal
          My_Ntp:
            class: NTP
            # Amazon Time Sync Service. Link-local, so it works with no internet egress and
            # no VPC endpoint - required here because provisionNatGateways='false' removes
            # the default route out of the private subnets. Do NOT revert this to
            # pool.ntp.org: NTP would silently fail, and clock skew breaks device trust,
            # config-sync and SigV4 request signing.
            servers:
              - 169.254.169.123
            timezone: UTC
          My_Dns:
            class: DNS
            nameServers:
              - 169.254.169.253
            search:
              - f5.com
          My_System:
            autoPhonehome: true
            class: System
            hostname: "{{{HOST_NAME}}}"
          admin:
            class: User
            userType: regular
            password: "{{{BIGIP_PASSWORD}}}"
            shell: bash
          external:
            class: VLAN
            tag: 4094
            mtu: 1500
            interfaces:
              - name: '1.1'
                tagged: false
          external-self:
            class: SelfIp
            address: "{{{SELF_IP_EXTERNAL}}}"
            vlan: external
            allowService:
              - tcp:443
              - udp:1026
              - tcp:4353
              - tcp:6123
              - tcp:6124
              - tcp:6125
              - tcp:6126
              - tcp:6127
              - tcp:6128
            trafficGroup: traffic-group-local-only
          internal:
            class: VLAN
            interfaces:
              - name: '1.2'
                tagged: false
            mtu: 1500
            tag: 4093
          internal-self:
            class: SelfIp
            address: "{{{SELF_IP_INTERNAL}}}"
            allowService: none
            trafficGroup: traffic-group-local-only
            vlan: internal
          default:
            class: Route
            gw: "{{{DEFAULT_GW}}}"
            network: default
            mtu: 1500
            localOnly: true
    - extensionType: cf
      type: inline
      value:
        schemaVersion: 1.0.0
        class: Cloud_Failover
        environment: aws
        controls:
          class: Controls
          logLevel: silly
        externalStorage:
          encryption:
            serverSide:
              enabled: true
              algorithm: AES256
          scopingName: "{{{CFE_STORAGE_NAME}}}"
        failoverAddresses:
          # Disabled deliberately. This solution has no Elastic IPs and no secondary
          # private IP addresses, so address failover has nothing to relocate - the VIP
          # moves by route instead (failoverRoutes below). Leaving it enabled makes CFE
          # scan for addresses on every failover and log the empty result, which is noise
          # in restnoded.log exactly where genuine route errors need to be visible.
          # Re-enable only if EIPs or secondary private IPs are added to this design.
          enabled: false
          scopingTags:
            f5_cloud_failover_label: "{{{FAILOVER_TAG}}}"
          requireScopingTags: false
        failoverRoutes:
          enabled: true
          routeGroupDefinitions:
            - scopingTags:
                f5_cloud_failover_label: "{{{FAILOVER_TAG}}}"
              scopingAddressRanges:
                - range: "{{{EXTERNAL_VIP_CIDR}}}"
              defaultNextHopAddresses:
                discoveryType: static
                items:
                  # Both entries MUST be bare addresses (no /mask). CFE matches these
                  # against the device's own local addresses to pick its next hop, and
                  # an entry like "10.0.0.11/24" never matches "10.0.0.11". Do NOT use
                  # SELF_IP_EXTERNAL here - it carries a mask because the DO SelfIp
                  # class requires one. Both values come from instance tags instead.
                  # This declaration is config-synced, so the list is identical on both
                  # devices and must contain both external Self IPs.
                  - "{{{OWN_SELF_IP_EXTERNAL}}}"
                  - "{{{PEER_SELF_IP_EXTERNAL}}}"
    - extensionType: as3
      type: inline
      value:
        class: ADC
        schemaVersion: 3.0.0
        label: Failover
        remark: Failover
        Tenant_1:
          class: Tenant
          Shared:
            class: Application
            template: shared
            Service_01_Pool:
              class: Pool
              remark: Service 1 shared pool
              members:
                - servicePort: 80
                  addressDiscovery: aws
                  region: "{{{REGION}}}"
                  updateInterval: 60
                  tagKey: aws:cloudformation:logical-id
                  tagValue: AppInstance
                  addressRealm: private
              monitors:
                - http
            Custom_HTTP_Profile:
              class: HTTP_Profile
              xForwardedFor: true
            Custom_WAF_Policy:
              class: WAF_Policy
              url: https://f5-cft-gov.s3.us-gov-east-1.amazonaws.com/f5-aws-cloudformation-v2/v3.6.0.0/examples/autoscale/bigip-configurations/Rapid_Deployment_Policy_13_1.xml
              enforcementMode: blocking
              ignoreChanges: false
            Demo_Responder:
              # Answers HTTP requests itself when the pool has no active members, which is
              # the case with provisionExampleApp=false. The page names the device that
              # served it and the VIP it arrived on, and refreshes every 2 seconds, so a
              # failover is visible in a browser. With a real back end (pool members
              # discovered) the rule does nothing and traffic is load balanced normally.
              class: iRule
              iRule: |
                when HTTP_REQUEST {
                    if { [active_members /Tenant_1/Shared/Service_01_Pool] > 0 } { return }
                    set host [info hostname]
                    set vip [IP::local_addr]
                    set client [IP::client_addr]
                    set now [clock format [clock seconds] -format "%Y-%m-%d %H:%M:%S %Z"]
                    HTTP::respond 200 content "<!DOCTYPE html><html><head><meta http-equiv=\"refresh\" content=\"2\"><title>F5 HA demo</title></head><body style=\"font-family:sans-serif;text-align:center;padding-top:100px\"><h1 style=\"font-size:56px;margin:0\">Served by</h1><h1 style=\"font-size:88px;color:#E4002B;margin:0\">$host</h1><p style=\"font-size:24px;color:#666\">VIP $vip &middot; client $client<br>$now</p></body></html>" noserver "Content-Type" "text/html" "Cache-Control" "no-store"
                }
            Service_Address_01:
              class: Service_Address
              virtualAddress: "{{{EXTERNAL_VIP_ADDRESS}}}"
          HTTP_Service_01:
            class: Application
            template: http
            serviceMain:
              class: Service_HTTP
              virtualAddresses:
                - use: "/Tenant_1/Shared/Service_Address_01"
              snat: auto
              pool: "/Tenant_1/Shared/Service_01_Pool"
              iRules:
                - use: "/Tenant_1/Shared/Demo_Responder"
              profileHTTP:
                use: "/Tenant_1/Shared/Custom_HTTP_Profile"
              policyWAF:
                use: "/Tenant_1/Shared/Custom_WAF_Policy"
          HTTPS_Service_01:
            class: Application
            template: https
            serviceMain:
              class: Service_HTTPS
              virtualAddresses:
                - use: "/Tenant_1/Shared/Service_Address_01"
              snat: auto
              pool: "/Tenant_1/Shared/Service_01_Pool"
              serverTLS:
                bigip: "/Common/clientssl"
              redirect80: false
              iRules:
                - use: "/Tenant_1/Shared/Demo_Responder"
              profileHTTP:
                use: "/Tenant_1/Shared/Custom_HTTP_Profile"
              policyWAF:
                use: "/Tenant_1/Shared/Custom_WAF_Policy"
    - extensionType: do
      type: inline
      value:
        schemaVersion: 1.0.0
        class: Device
        async: true
        label: Failover 3NIC BIG-IP declaration for Declarative Onboarding with PAYG
          license
        Common:
          class: Tenant
          My_DbVariables:
            class: DbVariables
            config.allow.rfc3927: enable
            tm.tcpudptxchecksum: Software-only
          My_Provisioning:
            asm: nominal
            class: Provision
            ltm: nominal
          My_Ntp:
            class: NTP
            # Amazon Time Sync Service. Link-local, so it works with no internet egress and
            # no VPC endpoint - required here because provisionNatGateways='false' removes
            # the default route out of the private subnets. Do NOT revert this to
            # pool.ntp.org: NTP would silently fail, and clock skew breaks device trust,
            # config-sync and SigV4 request signing.
            servers:
              - 169.254.169.123
            timezone: UTC
          My_Dns:
            class: DNS
            nameServers:
              - 169.254.169.253
            search:
              - f5.com
          My_System:
            autoPhonehome: true
            class: System
            hostname: "{{{HOST_NAME}}}"
          admin:
            class: User
            userType: regular
            password: "{{{BIGIP_PASSWORD}}}"
            shell: bash
          external:
            class: VLAN
            tag: 4094
            mtu: 1500
            interfaces:
              - name: '1.1'
                tagged: false
          external-self:
            class: SelfIp
            address: "{{{SELF_IP_EXTERNAL}}}"
            vlan: external
            allowService:
              - tcp:443
              - udp:1026
              - tcp:4353
              - tcp:6123
              - tcp:6124
              - tcp:6125
              - tcp:6126
              - tcp:6127
              - tcp:6128
            trafficGroup: traffic-group-local-only
          internal:
            class: VLAN
            interfaces:
              - name: '1.2'
                tagged: false
            mtu: 1500
            tag: 4093
          internal-self:
            class: SelfIp
            address: "{{{SELF_IP_INTERNAL}}}"
            allowService: none
            trafficGroup: traffic-group-local-only
            vlan: internal
          default:
            class: Route
            gw: "{{{DEFAULT_GW}}}"
            network: default
            mtu: 1500
            localOnly: true
          configSync:
            class: ConfigSync
            configsyncIp: "/Common/external-self/address"
          failoverAddress:
            class: FailoverUnicast
            address: "/Common/external-self/address"
          failoverGroup:
            class: DeviceGroup
            type: sync-failover
            members:
              - "{{{REMOTE_HOST_NAME}}}"
              - "{{{HOST_NAME}}}"
            owner: "/Common/failoverGroup/members/0"
            autoSync: true
            saveOnAutoSync: false
            networkFailover: true
            fullLoadOnSync: false
            asmSync: false
          trust:
            class: DeviceTrust
            localUsername: admin
            localPassword: "{{{BIGIP_PASSWORD}}}"
            remoteHost: "{{{REMOTE_HOST}}}"
            remoteUsername: admin
            remotePassword: "{{{BIGIP_PASSWORD}}}"
runtime_parameters:
  - name: SECRET_ID
    type: url
    value: file:///config/cloud/secret_id
  - name: BIGIP_PASSWORD
    type: secret
    secretProvider:
      environment: aws
      secretId: "{{{SECRET_ID}}}"
      type: SecretsManager
      version: AWSCURRENT
  - name: HOST_NAME
    type: tag
    tagProvider:
      environment: aws
      key: hostname
  - name: REMOTE_HOST
    type: tag
    tagProvider:
      environment: aws
      key: bigIpPeerAddr
  - name: REMOTE_HOST_NAME
    type: tag
    tagProvider:
      environment: aws
      key: bigIpPeerHostname
  - name: FAILOVER_TAG
    type: tag
    tagProvider:
      environment: aws
      key: failoverTag
  - name: CFE_STORAGE_NAME
    type: tag
    tagProvider:
      environment: aws
      key: cfeStorageName
  - name: SELF_IP_EXTERNAL
    type: metadata
    metadataProvider:
      environment: aws
      type: network
      field: local-ipv4s
      index: 1
  - name: SELF_IP_INTERNAL
    type: metadata
    metadataProvider:
      type: network
      environment: aws
      field: local-ipv4s
      index: 2
  - name: DEFAULT_GW
    type: metadata
    metadataProvider:
      environment: aws
      type: network
      field: local-ipv4s
      index: 1
      ipcalc: first
  - name: REGION
    type: metadata
    metadataProvider:
      environment: aws
      type: uri
      value: "/latest/dynamic/instance-identity/document"
      query: region
  - name: EXTERNAL_VIP_ADDRESS
    type: tag
    tagProvider:
      environment: aws
      key: externalVipAddress
  - name: EXTERNAL_VIP_CIDR
    type: tag
    tagProvider:
      environment: aws
      key: externalVipCidr
  - name: OWN_SELF_IP_EXTERNAL
    type: tag
    tagProvider:
      environment: aws
      key: externalSelfIp
  - name: PEER_SELF_IP_EXTERNAL
    type: tag
    tagProvider:
      environment: aws
      key: peerExternalSelfIp
